<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeGuard AI — AI Powered Code Plagiarism Detection Platform</title>
<meta name="description" content="CodeGuard AI: an AST-based, AI-assisted source code plagiarism detection platform for programming assignments.">
<!-- =========================================================
     CODEGUARD AI  —  Single-file demonstration prototype
     AI-Assisted, AST-based Source Code Plagiarism Detector
     Frontend simulation only. No real backend / AI model.
     ========================================================= -->
<style>
/* ========================= DESIGN TOKENS ========================= */
:root{
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;

  /* Brand — deep signal navy + cyan-teal analysis accent */
  --brand-900:#0b1e3a; --brand-800:#0f2b52; --brand-700:#153a6b;
  --brand-600:#1d4f8f; --brand-500:#2668b8; --brand-400:#4d8ad6;
  --accent-600:#0a8f8f; --accent-500:#12b0ac; --accent-400:#3fd0c9;

  --ok-600:#1a7f4b; --ok-500:#22a35f; --ok-100:#dff5e8;
  --warn-600:#b7791f; --warn-500:#e0a12b; --warn-100:#fbeecb;
  --danger-600:#c0392b; --danger-500:#e0503f; --danger-100:#fbe0dc;
  --info-600:#2668b8; --info-100:#dbe9fb;

  /* Neutral slate */
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f6f8fb;
  --line:#dbe2ec; --line-2:#e8edf4;
  --text:#12233c; --muted:#5a6a80; --faint:#8695a9;

  --sidebar-bg:#0b1e3a; --sidebar-text:#c3d0e2; --sidebar-active:#12b0ac;
  --shadow-sm:0 1px 2px rgba(16,35,60,.06),0 1px 3px rgba(16,35,60,.08);
  --shadow:0 4px 12px rgba(16,35,60,.08),0 2px 4px rgba(16,35,60,.06);
  --shadow-lg:0 14px 40px rgba(11,30,58,.18);
  --radius:14px; --radius-sm:9px; --radius-lg:20px;
  --maxw:1320px;
}
[data-theme="dark"]{
  --bg:#0a1424; --surface:#0f1e33; --surface-2:#13253d;
  --line:#20344f; --line-2:#1a2c44;
  --text:#e6edf6; --muted:#9db0c8; --faint:#6f829c;
  --sidebar-bg:#081120; --sidebar-text:#a9bad2;
  --brand-500:#3f82d6;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 6px 18px rgba(0,0,0,.45);
  --shadow-lg:0 18px 50px rgba(0,0,0,.6);
  --ok-100:#0e2e20; --warn-100:#33280d; --danger-100:#331714; --info-100:#122844;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans); background:var(--bg); color:var(--text);
  line-height:1.5; -webkit-font-smoothing:antialiased; font-size:14.5px;
}
h1,h2,h3,h4{margin:0 0 .35em; line-height:1.2; font-weight:700; letter-spacing:-.01em}
p{margin:0 0 1em}
a{color:var(--brand-500); text-decoration:none}
button{font-family:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--accent-400); outline-offset:2px; border-radius:6px}
.hidden{display:none !important}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12.5px}
.center{text-align:center}
.nowrap{white-space:nowrap}

/* ========================= BUTTONS ========================= */
.btn{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  border:1px solid transparent; background:var(--brand-600); color:#fff;
  padding:9px 16px; border-radius:var(--radius-sm); font-weight:600; font-size:13.5px;
  transition:transform .08s ease, box-shadow .15s ease, background .15s; box-shadow:var(--shadow-sm);
}
.btn:hover{transform:translateY(-1px); box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--brand-600),var(--brand-500))}
.btn.accent{background:linear-gradient(135deg,var(--accent-600),var(--accent-500))}
.btn.ghost{background:transparent; color:var(--text); border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.subtle{background:var(--surface-2); color:var(--text); border-color:var(--line)}
.btn.danger{background:linear-gradient(135deg,var(--danger-600),var(--danger-500))}
.btn.sm{padding:6px 11px; font-size:12.5px}
.btn.lg{padding:13px 24px; font-size:15px}
.btn.block{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none}

/* ========================= BADGES / CHIPS ========================= */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
  padding:3px 9px; border-radius:999px; letter-spacing:.02em; text-transform:capitalize}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-100); color:var(--ok-600)}
.b-warn{background:var(--warn-100); color:var(--warn-600)}
.b-danger{background:var(--danger-100); color:var(--danger-600)}
.b-info{background:var(--info-100); color:var(--info-600)}
.b-neutral{background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);
  padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}

/* ========================= CARDS ========================= */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm)}
.card.pad{padding:20px}
.grid{display:grid; gap:16px}
.stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden}
.stat-card .k{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
.stat-card .v{font-size:27px; font-weight:800; margin-top:4px; letter-spacing:-.02em}
.stat-card .d{font-size:12px; margin-top:3px; display:flex; align-items:center; gap:5px}
.stat-card .ic{position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:9px;
  display:grid; place-items:center; background:var(--surface-2); color:var(--brand-500)}
.up{color:var(--ok-600)} .down{color:var(--danger-600)}

/* ========================= TABLES ========================= */
.table-wrap{overflow-x:auto; border-radius:var(--radius)}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
table.tbl th{background:var(--surface-2); text-align:left; padding:11px 14px; font-size:11.5px;
  text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; border-bottom:1px solid var(--line);
  position:sticky; top:0; cursor:pointer; user-select:none; white-space:nowrap}
table.tbl th.nosort{cursor:default}
table.tbl td{padding:11px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:var(--surface-2)}
.th-sort::after{content:"⇅"; font-size:10px; opacity:.4; margin-left:5px}
.th-asc::after{content:"↑"; opacity:.9}
.th-desc::after{content:"↓"; opacity:.9}

/* ========================= FORMS ========================= */
.field{margin-bottom:14px}
.field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--text)}
.input,.select,textarea.input{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--surface); color:var(--text); font-size:14px; font-family:inherit; transition:border .15s, box-shadow .15s;
}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--brand-500); box-shadow:0 0 0 3px rgba(38,104,184,.15); outline:none}
.input-group{position:relative}
.input-group .toggle{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); padding:6px}
.hint{font-size:12px; color:var(--muted); margin-top:5px}
.err-txt{color:var(--danger-600); font-size:12px; margin-top:5px}
.checkbox{display:flex; align-items:flex-start; gap:9px; font-size:13px; cursor:pointer}
.checkbox input{margin-top:2px; width:16px; height:16px; accent-color:var(--brand-500)}

/* ========================= LAYOUT SHELL ========================= */
#app{min-height:100vh}
.shell{display:grid; grid-template-columns:250px 1fr; min-height:100vh}
.sidebar{background:var(--sidebar-bg); color:var(--sidebar-text); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow:hidden}
.sb-brand{display:flex; align-items:center; gap:11px; padding:18px 18px 16px; border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand .name{font-weight:800; color:#fff; font-size:16px; letter-spacing:-.01em}
.sb-brand .sub{font-size:10.5px; color:var(--accent-400); font-weight:600; letter-spacing:.03em}
.sb-role{margin:12px 14px 6px; padding:9px 12px; border-radius:10px; background:rgba(255,255,255,.05);
  font-size:11.5px; display:flex; align-items:center; gap:8px}
.sb-nav{flex:1; overflow-y:auto; padding:8px 10px 20px}
.sb-nav::-webkit-scrollbar{width:8px} .sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
.sb-group{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,.4);
  padding:14px 12px 6px; font-weight:700}
.sb-link{display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:9px; color:var(--sidebar-text);
  font-size:13.5px; font-weight:500; cursor:pointer; transition:background .12s, color .12s; margin-bottom:1px}
.sb-link:hover{background:rgba(255,255,255,.07); color:#fff}
.sb-link.active{background:linear-gradient(135deg,rgba(18,176,172,.22),rgba(18,176,172,.08)); color:#fff;
  box-shadow:inset 3px 0 0 var(--sidebar-active)}
.sb-link svg{width:18px; height:18px; flex-shrink:0; opacity:.85}
.sb-link .count{margin-left:auto; background:rgba(255,255,255,.12); color:#fff; font-size:10.5px;
  padding:1px 7px; border-radius:999px; font-weight:700}
.sb-foot{padding:12px 14px; border-top:1px solid rgba(255,255,255,.08); font-size:11px; color:rgba(255,255,255,.5)}

.main{display:flex; flex-direction:column; min-width:0}
.topbar{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; padding:11px 22px; box-shadow:var(--shadow-sm)}
.topbar .menu-btn{display:none; background:none; border:1px solid var(--line); border-radius:9px; padding:7px}
.search-box{flex:1; max-width:460px; position:relative}
.search-box input{width:100%; padding:9px 12px 9px 38px; border:1px solid var(--line); border-radius:10px;
  background:var(--surface-2); color:var(--text); font-size:13.5px}
.search-box .si{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted)}
.search-box .kbd{position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--faint);
  border:1px solid var(--line); border-radius:5px; padding:1px 6px; background:var(--surface)}
.topbar-actions{margin-left:auto; display:flex; align-items:center; gap:8px}
.icon-btn{background:none; border:1px solid var(--line); border-radius:10px; padding:8px; color:var(--muted);
  position:relative; display:grid; place-items:center; transition:background .12s, color .12s}
.icon-btn:hover{background:var(--surface-2); color:var(--text)}
.icon-btn .ndot{position:absolute; top:5px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--danger-500); border:2px solid var(--surface)}
.user-menu{display:flex; align-items:center; gap:9px; padding:5px 8px 5px 5px; border:1px solid var(--line);
  border-radius:999px; background:var(--surface-2); cursor:pointer}
.avatar{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:12.5px;
  color:#fff; background:linear-gradient(135deg,var(--brand-600),var(--accent-500)); flex-shrink:0}
.avatar.lg{width:56px;height:56px;font-size:20px}
.content{padding:24px; max-width:var(--maxw); width:100%; margin:0 auto; flex:1}
.page-head{display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; flex-wrap:wrap}
.page-head h1{font-size:23px; margin:0}
.page-head .sub{color:var(--muted); font-size:13.5px; margin-top:3px}
.page-head .actions{margin-left:auto; display:flex; gap:9px; flex-wrap:wrap}
.breadcrumbs{font-size:12px; color:var(--muted); margin-bottom:8px; display:flex; gap:6px; align-items:center}

/* ========================= SECTION / TOOLBAR ========================= */
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.toolbar .grow{flex:1}
.sec-title{font-size:15px; font-weight:700; margin:0 0 2px; display:flex; align-items:center; gap:8px}
.sec-sub{font-size:12.5px; color:var(--muted); margin-bottom:14px}
.divider{height:1px; background:var(--line); margin:18px 0}

/* ========================= PROGRESS / PIPELINE ========================= */
.pbar{height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; border:1px solid var(--line)}
.pbar > span{display:block; height:100%; background:linear-gradient(90deg,var(--accent-500),var(--brand-500)); border-radius:999px; transition:width .5s ease; width:0}
.pipeline-step{display:flex; gap:14px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line);
  border-radius:12px; background:var(--surface); margin-bottom:9px; transition:border .2s, background .2s}
.pipeline-step.active{border-color:var(--accent-500); box-shadow:0 0 0 3px rgba(18,176,172,.12)}
.pipeline-step.done{border-color:var(--ok-500)}
.ps-icon{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex-shrink:0;
  background:var(--surface-2); color:var(--muted); font-weight:700; font-size:13px; border:1px solid var(--line)}
.pipeline-step.active .ps-icon{background:var(--accent-500); color:#fff; border-color:var(--accent-500); animation:pulse 1.1s infinite}
.pipeline-step.done .ps-icon{background:var(--ok-500); color:#fff; border-color:var(--ok-500)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,176,172,.5)} 50%{box-shadow:0 0 0 6px rgba(18,176,172,0)}}
.ps-body{flex:1; min-width:0}
.ps-title{font-weight:700; font-size:13.5px}
.ps-desc{font-size:12px; color:var(--muted)}
.ps-state{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em}

/* ========================= GAUGE / RING ========================= */
.ring{--v:0; width:120px; height:120px; border-radius:50%; display:grid; place-items:center; position:relative;
  background:conic-gradient(var(--ring-c,var(--brand-500)) calc(var(--v)*1%), var(--surface-2) 0)}
.ring::before{content:""; position:absolute; inset:11px; border-radius:50%; background:var(--surface)}
.ring .rv{position:relative; font-size:26px; font-weight:800}
.ring .rl{position:relative; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}

/* ========================= MODAL ========================= */
.modal-overlay{position:fixed; inset:0; background:rgba(8,17,32,.55); backdrop-filter:blur(3px); z-index:120;
  display:grid; place-items:center; padding:20px; animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  width:100%; max-width:560px; max-height:90vh; overflow:auto; animation:pop .18s ease}
.modal.wide{max-width:900px} .modal.xwide{max-width:1120px}
@keyframes pop{from{transform:translateY(12px) scale(.98); opacity:0}to{transform:none; opacity:1}}
.modal-head{display:flex; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); z-index:2}
.modal-head h3{margin:0; font-size:17px}
.modal-head .x{margin-left:auto; background:none; border:none; color:var(--muted); padding:6px; border-radius:8px}
.modal-head .x:hover{background:var(--surface-2)}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; position:sticky; bottom:0; background:var(--surface)}

/* ========================= TOAST ========================= */
#toasts{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:10px; max-width:360px}
.toast{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--brand-500); border-radius:12px;
  padding:13px 15px; box-shadow:var(--shadow-lg); display:flex; gap:11px; align-items:flex-start; animation:slidein .25s ease}
@keyframes slidein{from{transform:translateX(30px); opacity:0}to{transform:none; opacity:1}}
.toast.ok{border-left-color:var(--ok-500)} .toast.warn{border-left-color:var(--warn-500)}
.toast.danger{border-left-color:var(--danger-500)} .toast.info{border-left-color:var(--info-600)}
.toast .tt{font-weight:700; font-size:13.5px} .toast .tm{font-size:12.5px; color:var(--muted)}
.toast .tx{margin-left:auto; background:none; border:none; color:var(--faint); cursor:pointer}

/* ========================= LANDING ========================= */
.pub-nav{position:sticky; top:0; z-index:50; background:rgba(255,255,255,.86); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
[data-theme="dark"] .pub-nav{background:rgba(15,30,51,.86)}
.pub-nav .inner{max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; gap:16px; padding:14px 22px}
.pub-nav .links{margin-left:auto; display:flex; align-items:center; gap:6px}
.pub-nav .links a{padding:8px 12px; border-radius:8px; color:var(--muted); font-weight:600; font-size:13.5px}
.pub-nav .links a:hover{color:var(--text); background:var(--surface-2)}
.brand-mark{display:flex; align-items:center; gap:11px}
.brand-mark .bt{font-weight:800; font-size:17px; letter-spacing:-.01em}
.brand-mark .bs{font-size:10px; color:var(--accent-500); font-weight:700; letter-spacing:.02em; margin-top:-2px}
.hero{position:relative; overflow:hidden; background:
  radial-gradient(1200px 500px at 78% -10%, rgba(18,176,172,.18), transparent 60%),
  radial-gradient(1000px 500px at 10% 0%, rgba(38,104,184,.16), transparent 55%),
  linear-gradient(180deg,var(--brand-900),var(--brand-800) 60%,var(--brand-900))}
.hero .inner{max-width:var(--maxw); margin:0 auto; padding:70px 22px 90px; display:grid; grid-template-columns:1.05fr .95fr; gap:40px; align-items:center}
.hero h1{color:#fff; font-size:clamp(30px,4.4vw,48px); line-height:1.06; letter-spacing:-.025em; margin-bottom:18px}
.hero h1 .g{background:linear-gradient(120deg,var(--accent-400),#8fe6df); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero p.lead{color:#c6d4e8; font-size:17px; max-width:560px; margin-bottom:26px}
.hero .cta-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:26px}
.hero .eyebrow{display:inline-flex; align-items:center; gap:8px; background:rgba(18,176,172,.14); border:1px solid rgba(18,176,172,.3);
  color:var(--accent-400); font-weight:700; font-size:12px; padding:6px 12px; border-radius:999px; margin-bottom:22px; letter-spacing:.02em}
.hero-stats{display:flex; gap:26px; flex-wrap:wrap}
.hero-stats .hv{color:#fff; font-size:24px; font-weight:800} .hero-stats .hl{color:#9fb2cd; font-size:12px}
.hero-visual{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:22px; box-shadow:var(--shadow-lg)}
.flow-node{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12); margin-bottom:10px; color:#dbe6f5; transition:all .4s; opacity:.55}
.flow-node.lit{opacity:1; background:rgba(18,176,172,.16); border-color:rgba(18,176,172,.5); transform:translateX(4px)}
.flow-node .fn-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--accent-400);flex-shrink:0}
.flow-node.lit .fn-ic{background:var(--accent-500); color:#fff}
.flow-node .fn-t{font-weight:700; font-size:13px} .flow-node .fn-s{font-size:11px; opacity:.7}
.flow-arrow{text-align:center; color:rgba(255,255,255,.3); font-size:14px; margin:-4px 0 6px}
.section{max-width:var(--maxw); margin:0 auto; padding:64px 22px}
.section h2{font-size:clamp(24px,3.2vw,34px); text-align:center; margin-bottom:10px}
.section .sec-lead{text-align:center; color:var(--muted); max-width:640px; margin:0 auto 40px; font-size:16px}
.feat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
.feat{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px; box-shadow:var(--shadow-sm); transition:transform .15s, box-shadow .15s}
.feat:hover{transform:translateY(-3px); box-shadow:var(--shadow)}
.feat .fi{width:46px; height:46px; border-radius:12px; display:grid; place-items:center; margin-bottom:14px;
  background:linear-gradient(135deg,rgba(18,176,172,.16),rgba(38,104,184,.14)); color:var(--accent-600)}
.feat h3{font-size:17px} .feat p{font-size:13.5px; color:var(--muted); margin:0}
.steps-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; counter-reset:step}
.step{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; position:relative; box-shadow:var(--shadow-sm)}
.step::before{counter-increment:step; content:"0" counter(step); position:absolute; top:16px; right:18px; font-size:34px; font-weight:800; color:var(--line); font-family:var(--font-mono)}
.step h4{font-size:15px} .step p{font-size:13px; color:var(--muted); margin:0}
.lang-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px}
.lang-pill{display:flex; align-items:center; gap:9px; padding:11px 18px; border:1px solid var(--line); border-radius:12px; background:var(--surface); font-weight:700; box-shadow:var(--shadow-sm)}
.integrity-band{background:linear-gradient(135deg,var(--brand-800),var(--brand-700)); color:#fff; border-radius:20px; padding:38px; text-align:center; max-width:900px; margin:0 auto}
.integrity-band h3{color:#fff; font-size:22px} .integrity-band p{color:#c6d4e8; max-width:640px; margin:0 auto; font-size:15px}
.pub-footer{background:var(--brand-900); color:#9fb2cd; padding:44px 22px 30px; margin-top:40px}
.pub-footer .inner{max-width:var(--maxw); margin:0 auto; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:30px}
.pub-footer h5{color:#fff; font-size:13px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:12px}
.pub-footer a{display:block; color:#9fb2cd; font-size:13.5px; padding:4px 0}
.pub-footer a:hover{color:#fff}

/* ========================= AUTH ========================= */
.auth-wrap{min-height:100vh; display:grid; grid-template-columns:1.1fr 1fr}
.auth-side{background:
  radial-gradient(900px 500px at 20% 10%, rgba(18,176,172,.2), transparent 55%),
  linear-gradient(160deg,var(--brand-900),var(--brand-700)); color:#fff; padding:56px 54px; display:flex; flex-direction:column; justify-content:space-between}
.auth-side h2{color:#fff; font-size:30px; line-height:1.15}
.auth-side p{color:#c6d4e8; font-size:15px; max-width:440px}
.auth-feat{display:flex; gap:12px; align-items:flex-start; margin-bottom:16px; color:#dbe6f5}
.auth-feat .af-ic{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:var(--accent-400);flex-shrink:0}
.auth-main{display:grid; place-items:center; padding:40px 24px; background:var(--bg)}
.auth-card{width:100%; max-width:410px}
.auth-card h1{font-size:24px}
.demo-creds{background:var(--surface-2); border:1px dashed var(--line); border-radius:12px; padding:14px; margin:18px 0; font-size:12.5px}
.demo-creds .dc-row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0}
.demo-creds code{font-family:var(--font-mono); font-size:11.5px; background:var(--surface); padding:2px 6px; border-radius:5px; border:1px solid var(--line)}
.seg{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:3px; margin-bottom:16px}
.seg button{flex:1; border:none; background:none; padding:8px; border-radius:8px; font-weight:600; font-size:13px; color:var(--muted)}
.seg button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm)}

/* ========================= AST / SVG ========================= */
.ast-canvas{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; overflow:hidden; position:relative}
.ast-node rect{transition:fill .2s, stroke .2s}
.ast-node text{font-family:var(--font-mono); font-size:11px; pointer-events:none}
.ast-controls{position:absolute; top:10px; right:10px; display:flex; gap:6px; z-index:2}
.compare-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.code-panel{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface)}
.code-panel .cp-head{background:var(--surface-2); padding:9px 14px; border-bottom:1px solid var(--line); font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:8px}
.code-body{font-family:var(--font-mono); font-size:12.5px; line-height:1.7; margin:0; padding:0; max-height:420px; overflow:auto}
.code-line{display:flex; padding:0 14px}
.code-line .ln{width:34px; color:var(--faint); text-align:right; padding-right:12px; user-select:none; flex-shrink:0}
.code-line .lc{white-space:pre; flex:1}
.code-line.match{background:rgba(224,161,43,.16)}
.code-line.match-hi{background:rgba(224,80,63,.18)}
[data-theme="dark"] .code-line.match{background:rgba(224,161,43,.14)}

/* code editor */
.editor-wrap{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#0d1a2b}
.editor-head{background:#0a1524; color:#c6d4e8; padding:8px 14px; font-size:12px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #1c2f48}
.editor-body{display:flex; font-family:var(--font-mono); font-size:13px; line-height:1.65; max-height:340px; overflow:auto}
.editor-gutter{background:#0a1524; color:#4c6285; text-align:right; padding:12px 10px; user-select:none; min-width:44px}
.editor-ta{flex:1; background:#0d1a2b; color:#dce8f7; border:none; resize:none; padding:12px 14px; font-family:var(--font-mono);
  font-size:13px; line-height:1.65; outline:none; white-space:pre; overflow:auto; tab-size:4}

/* ========================= EVIDENCE ========================= */
.evidence-card{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:10px; background:var(--surface)}
.evidence-head{display:flex; align-items:center; gap:12px; padding:13px 16px; cursor:pointer}
.evidence-head:hover{background:var(--surface-2)}
.evidence-body{padding:0 16px 16px; font-size:13px; color:var(--muted)}
.ev-conf{margin-left:auto}

/* ========================= COMMAND PALETTE ========================= */
.cmdk{position:fixed; inset:0; z-index:150; background:rgba(8,17,32,.5); backdrop-filter:blur(3px); display:grid; place-items:start center; padding-top:12vh; animation:fade .12s}
.cmdk-box{width:100%; max-width:600px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-lg); overflow:hidden; animation:pop .16s}
.cmdk-input{width:100%; padding:16px 18px; border:none; border-bottom:1px solid var(--line); background:transparent; color:var(--text); font-size:16px; outline:none}
.cmdk-results{max-height:50vh; overflow:auto; padding:8px}
.cmdk-item{display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:10px; cursor:pointer; font-size:13.5px}
.cmdk-item.sel,.cmdk-item:hover{background:var(--surface-2)}
.cmdk-item .ci-ic{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--brand-500);border:1px solid var(--line)}
.cmdk-item .ci-kind{margin-left:auto; font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.04em}
.cmdk-group{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); padding:10px 13px 4px; font-weight:700}

/* ========================= NOTIF DROPDOWN ========================= */
.dropdown{position:absolute; top:52px; right:0; width:360px; background:var(--surface); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow-lg); z-index:60; overflow:hidden}
.dropdown.user{width:250px}
.dd-head{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px}
.dd-list{max-height:380px; overflow:auto}
.notif-item{display:flex; gap:11px; padding:12px 16px; border-bottom:1px solid var(--line-2); cursor:pointer}
.notif-item:hover{background:var(--surface-2)}
.notif-item.unread{background:rgba(38,104,184,.05)}
.notif-item .ni-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.notif-item .ni-t{font-weight:600; font-size:13px} .notif-item .ni-m{font-size:12px; color:var(--muted)}
.notif-item .ni-time{font-size:11px; color:var(--faint); margin-top:3px}
.dd-item{padding:10px 14px; display:flex; align-items:center; gap:10px; cursor:pointer; font-size:13.5px}
.dd-item:hover{background:var(--surface-2)}

/* ========================= MISC ========================= */
.kv{display:grid; grid-template-columns:auto 1fr; gap:8px 18px; font-size:13.5px}
.kv dt{color:var(--muted); font-weight:600} .kv dd{margin:0; font-weight:600}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto}
.tab{padding:10px 15px; border:none; background:none; font-weight:600; font-size:13.5px; color:var(--muted); border-bottom:2px solid transparent; white-space:nowrap; cursor:pointer}
.tab.active{color:var(--brand-500); border-bottom-color:var(--brand-500)}
.notice{display:flex; gap:12px; padding:14px 16px; border-radius:12px; font-size:13px; align-items:flex-start}
.notice.integrity{background:var(--info-100); border:1px solid rgba(38,104,184,.25); color:var(--text)}
.notice.warn{background:var(--warn-100); border:1px solid rgba(224,161,43,.35)}
.notice.danger{background:var(--danger-100); border:1px solid rgba(224,80,63,.35)}
.notice .ni{flex-shrink:0; color:var(--brand-500)}
.pagination{display:flex; gap:5px; align-items:center; justify-content:flex-end; margin-top:14px; font-size:13px}
.pagination button{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 11px; color:var(--text); font-weight:600}
.pagination button.active{background:var(--brand-600); color:#fff; border-color:var(--brand-600)}
.pagination button:disabled{opacity:.4}
.entity-box{border:2px solid var(--brand-500); border-radius:10px; background:var(--surface); font-size:11px; box-shadow:var(--shadow-sm)}
.mono-tag{font-family:var(--font-mono); font-size:11.5px; background:var(--surface-2); padding:2px 7px; border-radius:6px; border:1px solid var(--line)}
.progress-track{display:flex; align-items:center; gap:0; margin:14px 0}
.pt-node{flex:1; text-align:center; position:relative; font-size:11px}
.pt-node .ptc{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);display:grid;place-items:center;margin:0 auto 6px;font-weight:700;font-size:11px}
.pt-node.done .ptc{background:var(--ok-500);color:#fff;border-color:var(--ok-500)}
.pt-node.active .ptc{background:var(--brand-500);color:#fff;border-color:var(--brand-500)}
.pt-node::after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--line);z-index:-1}
.pt-node:last-child::after{display:none}
.pt-node.done::after{background:var(--ok-500)}
.empty{text-align:center; padding:50px 20px; color:var(--muted)}
.empty svg{opacity:.4; margin-bottom:12px}
.access-denied{max-width:460px; margin:60px auto; text-align:center}
.access-denied .ad-ic{width:72px;height:72px;border-radius:20px;background:var(--danger-100);color:var(--danger-600);display:grid;place-items:center;margin:0 auto 18px}
.help-toc{position:sticky; top:80px}
.skeleton{background:linear-gradient(90deg,var(--surface-2),var(--line-2),var(--surface-2)); background-size:200% 100%; animation:shim 1.3s infinite; border-radius:8px}
@keyframes shim{to{background-position:-200% 0}}

/* mini bar chart / donut */
.barchart{display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:10px}
.barchart .bar{flex:1; background:linear-gradient(180deg,var(--brand-500),var(--brand-600)); border-radius:6px 6px 0 0; position:relative; min-height:4px; transition:height .5s}
.barchart .bar:hover{filter:brightness(1.1)}
.barchart .bar .bl{position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:10px; color:var(--muted)}
.barchart .bar .bv{position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:10px; font-weight:700}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; margin-top:8px}
.legend .li{display:flex; align-items:center; gap:6px} .legend .sw{width:11px;height:11px;border-radius:3px}

/* ========================= RESPONSIVE ========================= */
@media (max-width:1080px){
  .hero .inner{grid-template-columns:1fr} .hero-visual{display:none}
  .feat-grid,.steps-grid{grid-template-columns:1fr 1fr}
  .auth-wrap{grid-template-columns:1fr} .auth-side{display:none}
  .pub-footer .inner{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed; z-index:110; width:260px; transform:translateX(-100%); transition:transform .25s; box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .sb-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:105}
  .topbar .menu-btn{display:grid; place-items:center}
  .search-box{display:none}
  .search-box.mobile-show{display:block}
  .compare-grid{grid-template-columns:1fr}
  .feat-grid,.steps-grid{grid-template-columns:1fr}
  .content{padding:16px}
}
@media (max-width:560px){
  .pub-footer .inner{grid-template-columns:1fr}
  .hero .inner{padding:44px 18px 60px}
  .page-head .actions{width:100%}
  .modal-foot{flex-wrap:wrap}
  .user-menu .um-txt{display:none}
}
@media print{
  .sidebar,.topbar,.no-print{display:none !important}
  .shell{grid-template-columns:1fr} .content{padding:0; max-width:100%}
  body{background:#fff}
  .card,.report-doc{box-shadow:none; border-color:#ccc}
}
</style>

/* ========================= ANALYSIS / AST ENGINE (deterministic demo) ========================= */
// Tokenize source, strip comments/whitespace per config; produce token & structural signatures.
function tokenize(code, cfg){
  let src=code;
  if(cfg.removeComments){ src=src.replace(/#.*$/gm,'').replace(/\/\/.*$/gm,'').replace(/\/\*[\s\S]*?\*\//g,''); }
  if(cfg.normalizeFormatting){ src=src.replace(/[ \t]+/g,' '); }
  if(!cfg.caseSensitive){ src=src.toLowerCase(); }
  const toks=src.match(/[A-Za-z_]\w*|\d+\.?\d*|==|!=|>=|<=|[+\-*/%=<>(){}\[\]:,.]/g)||[];
  return toks;
}
// Normalize identifiers to positional placeholders (var renaming resilience).
const PY_KW=new Set(['def','return','for','in','if','elif','else','while','import','from','print','range','len','and','or','not','true','false','none','class','self','statistics','mean','append','int','float','str','list','map']);
function normalizeIdentifiers(tokens){
  const map={}; let c=0;
  return tokens.map(t=>{
    if(/^[A-Za-z_]\w*$/.test(t) && !PY_KW.has(t)){
      if(!(t in map)) map[t]='ID'+(c++);
      return map[t];
    }
    if(/^\d/.test(t)) return 'NUM';
    return t;
  });
}
// Structural signature: sequence of control-flow / structural keywords + shape
function structuralSig(tokens){
  const struct=['def','for','while','if','elif','else','return','class','import','(',')','{','}','[',']',':','=','+','-','*','/'];
  return tokens.filter(t=>struct.includes(t));
}
// Jaccard on n-gram shingles
function shingles(arr,n){ const s=new Set(); for(let i=0;i+n<=arr.length;i++) s.add(arr.slice(i,i+n).join('|')); return s; }
function jaccard(a,b){ if(!a.size&&!b.size) return 1; let inter=0; a.forEach(x=>{if(b.has(x))inter++;}); const uni=a.size+b.size-inter; return uni? inter/uni : 0; }

function analyzePair(codeA, codeB, cfg){
  cfg=cfg||DB.config;
  const tA=tokenize(codeA,cfg), tB=tokenize(codeB,cfg);
  const nA=cfg.normalizeIdentifiers?normalizeIdentifiers(tA):tA;
  const nB=cfg.normalizeIdentifiers?normalizeIdentifiers(tB):tB;
  const sA=structuralSig(tA), sB=structuralSig(tB);

  const tokenSim=jaccard(shingles(tA,3),shingles(tB,3));
  const normSim=jaccard(shingles(nA,3),shingles(nB,3));
  const structSim=jaccard(shingles(sA,2),shingles(sB,2));
  // AST/structural score leans on normalized + structural signatures
  const astScore=Math.min(1,(structSim*0.55 + normSim*0.45));
  // AI-assisted ranker: bounded blend + small deterministic adjustment
  const lenRatio=Math.min(tA.length,tB.length)/Math.max(tA.length,tB.length||1);
  const aiScore=Math.min(1, (astScore*0.6 + tokenSim*0.25 + lenRatio*0.15));

  const w=cfg.astWeight+cfg.tokenWeight+cfg.aiWeight;
  const overall=(astScore*cfg.astWeight + tokenSim*cfg.tokenWeight + aiScore*cfg.aiWeight)/(w||1);

  const pct=x=>Math.round(x*1000)/10;
  return {
    tokenSim:pct(tokenSim), normSim:pct(normSim), structSim:pct(astScore),
    aiScore:pct(aiScore), overall:pct(overall),
    confidence: astScore>0.8?'High': astScore>0.55?'Medium':'Low',
    classification: classifySim(pct(overall)),
    tokensA:tA.length, tokensB:tB.length
  };
}

/* --- Simplified AST builder for demo Python-ish code --- */
let AST_UID=0;
function node(type,label,children){ return {id:'n'+(AST_UID++), type, label, children:children||[]}; }
function buildDemoAST(code){
  AST_UID=0;
  const root=node('Module','Module',[]);
  const lines=code.split('\n').map(l=>l.replace(/\s+$/,''));
  const stack=[{indent:-1, node:root}];
  for(let raw of lines){
    if(!raw.trim()) continue;
    const indent=raw.match(/^\s*/)[0].length;
    const line=raw.trim();
    while(stack.length>1 && indent<=stack[stack.length-1].indent) stack.pop();
    const parent=stack[stack.length-1].node;
    let nn;
    if(/^def\s+(\w+)/.test(line)){ nn=node('FunctionDef', 'def '+RegExp.$1, [node('Arguments','args',[])]); parent.children.push(nn); stack.push({indent, node:nn}); }
    else if(/^class\s+(\w+)/.test(line)){ nn=node('ClassDef','class '+RegExp.$1,[]); parent.children.push(nn); stack.push({indent, node:nn}); }
    else if(/^for\s+/.test(line)){ nn=node('For','for',[node('Iterator','iter',[])]); parent.children.push(nn); stack.push({indent, node:nn}); }
    else if(/^while\s+/.test(line)){ nn=node('While','while',[]); parent.children.push(nn); stack.push({indent, node:nn}); }
    else if(/^if\s+/.test(line)){ nn=node('If','if',[node('Compare','cond',[])]); parent.children.push(nn); stack.push({indent, node:nn}); }
    else if(/^elif\s+/.test(line)){ nn=node('If','elif',[node('Compare','cond',[])]); parent.children.push(nn); stack.push({indent, node:nn}); }
    else if(/^else/.test(line)){ nn=node('Else','else',[]); parent.children.push(nn); stack.push({indent, node:nn}); }
    else if(/^return/.test(line)){ nn=node('Return','return',[]); parent.children.push(nn); }
    else if(/^import\s+|^from\s+/.test(line)){ nn=node('Import','import',[]); parent.children.push(nn); }
    else if(/^print/.test(line)){ nn=node('Call','print()',[]); parent.children.push(nn); }
    else if(/=/.test(line) && !/==/.test(line)){
      const rhs=line.split('=')[1]||'';
      const op = /\+/.test(rhs)?'BinOp +': /-/.test(rhs)?'BinOp -': /\*/.test(rhs)?'BinOp *': /\//.test(rhs)?'BinOp /':'value';
      nn=node('Assign','assign', op.startsWith('BinOp')?[node('BinOp',op,[node('Name','name',[]),node('Name','name',[])])]:[node('Name','name',[])]);
      parent.children.push(nn);
    } else {
      nn=node('Expr','expr',[]); parent.children.push(nn);
    }
  }
  return root;
}
// canonical structure string (types only) for equivalence highlighting
function astCanon(n){ return n.type+'('+n.children.map(astCanon).join(',')+')'; }

/* Layout AST into SVG coordinates (simple tidy layout) */
function layoutAST(root, xGap=118, yGap=64){
  let leaf=0;
  function place(n, depth){
    n.depth=depth;
    if(!n.children.length || n.collapsed){ n.x=leaf*xGap; leaf++; }
    else { n.children.forEach(c=>place(c,depth+1)); n.x=(n.children[0].x+n.children[n.children.length-1].x)/2; }
    n.y=depth*yGap;
  }
  place(root,0);
  return root;
}
function collectNodes(n, out, edges, parent){
  out.push(n);
  if(parent) edges.push([parent,n]);
  if(!n.collapsed) n.children.forEach(c=>collectNodes(c,out,edges,n));
  return {out,edges};
}

  if(!u || u.pass!==pass){ err.textContent='Invalid credentials. Check the demo accounts above.'; err.classList.remove('hidden'); logAudit('Failed Login','Authentication','Warning','Failure'); return; }
  if(u.status==='Suspended'){ err.textContent='This account is suspended. Contact your administrator.'; err.classList.remove('hidden'); return; }
  err.classList.add('hidden');
  S.currentUser=u; S.view='app'; S.page='dashboard';

  persist(); persistSession();
  logAudit('Login','Authentication','Info','Success');

/* ========================= COMMAND PALETTE (Ctrl+K) ========================= */
function buildCommands(){
  const role=S.currentUser.role; const cmds=[];
  navFor(role).forEach(n=>{ if(n.id) cmds.push({kind:'Navigate', label:'Go to '+n.t, ic:n.ic, run:()=>go(n.id)}); });
  if(role!=='Student'){
    cmds.push({kind:'Action', label:'Run new analysis', ic:'cpu', run:()=>go('analysis')});
    cmds.push({kind:'Action', label:'View high-risk cases', ic:'shield', run:()=>{ S._caseFilter='High'; go('cases'); }});
  }
  if(role==='Administrator'){
    cmds.push({kind:'Action', label:'Create user', ic:'plus', run:()=>{ go('users'); setTimeout(openAddUser,120); }});
    cmds.push({kind:'Action', label:'Open audit logs', ic:'scroll', run:()=>go('audit')});
    cmds.push({kind:'Action', label:'Open security center', ic:'lock', run:()=>go('security')});
    cmds.push({kind:'Action', label:'Open database', ic:'db', run:()=>go('database')});
  }
  if(role==='Student'){ cmds.push({kind:'Action', label:'Submit code', ic:'upload', run:()=>go('submit')}); }
  // data
  DB.assignments.forEach(a=>cmds.push({kind:'Assignment', label:a.title, ic:'file', run:()=>go('assignments')}));
  if(role!=='Student') DB.cases.forEach(c=>cmds.push({kind:'Case', label:c.id+' · '+c.assignmentTitle, ic:'shield', run:()=>openCaseDetail(c.id)}));
  if(role==='Administrator') DB.users.forEach(u=>cmds.push({kind:'User', label:u.name+' ('+u.role+')', ic:'user', run:()=>go('users')}));
  return cmds;
}
function openCmdK(){
  if($('#cmdkRoot')) return;
  const cmds=buildCommands();
  const root=el(`<div class="cmdk" id="cmdkRoot"><div class="cmdk-box">
    <input class="cmdk-input" id="cmdkInput" placeholder="Type a command or search…" autocomplete="off">
    <div class="cmdk-results" id="cmdkResults"></div></div></div>`);
  $('#overlay-root').appendChild(root);
  let sel=0, filtered=cmds;
  const draw=()=>{
    const q=$('#cmdkInput').value.toLowerCase();
    filtered=q? cmds.filter(c=>c.label.toLowerCase().includes(q)||c.kind.toLowerCase().includes(q)):cmds;
    filtered=filtered.slice(0,40); if(sel>=filtered.length) sel=0;
    const groups={}; filtered.forEach((c,i)=>{ (groups[c.kind]=groups[c.kind]||[]).push({c,i}); });
    $('#cmdkResults').innerHTML=Object.keys(groups).map(g=>`<div class="cmdk-group">${g}</div>`+groups[g].map(({c,i})=>`<div class="cmdk-item ${i===sel?'sel':''}" data-i="${i}"><div class="ci-ic">${IC[c.ic]||IC.chevR}</div><span>${esc(c.label)}</span><span class="ci-kind">${c.kind}</span></div>`).join('')).join('')||'<div class="empty small">No matches</div>';
    $$('.cmdk-item',root).forEach(it=>it.onclick=()=>{ run(+it.dataset.i); });
  };
  const run=i=>{ const c=filtered[i]; close(); if(c) c.run(); };
  const close=()=>{ root.remove(); document.removeEventListener('keydown',key); };
  const key=e=>{
    if(e.key==='Escape') close();
    else if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,filtered.length-1); draw(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); draw(); }
    else if(e.key==='Enter'){ e.preventDefault(); run(sel); }
  };
  $('#cmdkInput',root).addEventListener('input',()=>{sel=0;draw();});
  document.addEventListener('keydown',key);
  root.onclick=e=>{ if(e.target===root) close(); };
  draw(); $('#cmdkInput',root).focus();
}

/* ========================= REUSABLE TABLE ========================= */
// options: columns [{key,label,render,sort,nosort}], rows, page state key, search fields, filters
function DataTable(opts){
  const st = S._tables[opts.id] = S._tables[opts.id] || {sort:opts.defaultSort||null, dir:opts.defaultDir||'asc', page:1, q:'', filters:{}};
  const perPage=opts.perPage||8;
  let rows=opts.rows.slice();
  // search
  if(st.q && opts.searchFields){ const q=st.q.toLowerCase(); rows=rows.filter(r=>opts.searchFields.some(f=>String(r[f]||'').toLowerCase().includes(q))); }
  // filters
  Object.keys(st.filters).forEach(k=>{ const v=st.filters[k]; if(v&&v!=='all') rows=rows.filter(r=>String(r[k])===v); });
  // sort
  if(st.sort){ rows.sort((a,b)=>{ let x=a[st.sort], y=b[st.sort]; if(typeof x==='string'){x=x.toLowerCase();y=String(y).toLowerCase();} return (x<y?-1:x>y?1:0)*(st.dir==='asc'?1:-1); }); }
  const total=rows.length, pages=Math.max(1,Math.ceil(total/perPage));
  if(st.page>pages) st.page=pages;
  const pageRows=rows.slice((st.page-1)*perPage, st.page*perPage);

  const filtersHTML=(opts.filterDefs||[]).map(f=>`<select class="select" data-filter="${f.key}" style="width:auto;min-width:130px">
    <option value="all">${f.label}: All</option>${f.options.map(o=>`<option value="${esc(o)}" ${st.filters[f.key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`).join('');

  const html=`
  <div class="toolbar">
    ${opts.searchFields?`<div class="search-box" style="max-width:280px;display:block"><span class="si">${IC.search}</span><input class="input" data-tsearch placeholder="${opts.searchPlaceholder||'Search…'}" value="${esc(st.q)}" style="padding-left:36px"></div>`:''}
    ${filtersHTML}
    <div class="grow"></div>
    ${opts.actions||''}
  </div>
  <div class="card"><div class="table-wrap"><table class="tbl"><thead><tr>
    ${opts.columns.map(c=>`<th data-sk="${c.nosort?'':c.key}" class="${c.nosort?'nosort':(st.sort===c.key?('th-'+st.dir):'th-sort')}">${c.label}</th>`).join('')}
  </tr></thead><tbody>
    ${pageRows.length? pageRows.map(r=>`<tr data-row='${esc(JSON.stringify(r.id||r.name||''))}'>${opts.columns.map(c=>`<td>${c.render?c.render(r):esc(r[c.key])}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${opts.columns.length}"><div class="empty">${IC.folder}<div>No records match your filters.</div></div></td></tr>`}
  </tbody></table></div>
  <div style="padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span class="small muted">Showing ${total?((st.page-1)*perPage+1):0}–${Math.min(st.page*perPage,total)} of ${total}</span>
    <div class="pagination">
      <button data-pg="prev" ${st.page<=1?'disabled':''}>Prev</button>
      ${Array.from({length:pages},(_,i)=>i+1).slice(Math.max(0,st.page-3),st.page+2).map(p=>`<button data-pg="${p}" class="${p===st.page?'active':''}">${p}</button>`).join('')}
      <button data-pg="next" ${st.page>=pages?'disabled':''}>Next</button>
    </div>
  </div></div>`;

  return {html, rows:pageRows, wire:(container)=>{
    const ts=$('[data-tsearch]',container); if(ts){ ts.oninput=()=>{ st.q=ts.value; st.page=1; opts.rerender(); }; }
    $$('[data-filter]',container).forEach(f=>f.onchange=()=>{ st.filters[f.dataset.filter]=f.value; st.page=1; opts.rerender(); });
    $$('th[data-sk]',container).forEach(th=>{ const k=th.dataset.sk; if(!k) return; th.onclick=()=>{ if(st.sort===k) st.dir=st.dir==='asc'?'desc':'asc'; else {st.sort=k;st.dir='asc';} opts.rerender(); }; });
    $$('[data-pg]',container).forEach(b=>b.onclick=()=>{ const v=b.dataset.pg; if(v==='prev')st.page--; else if(v==='next')st.page++; else st.page=+v; opts.rerender(); });
    opts.wireRows&&opts.wireRows(container);
  }};
}

/* ========================= CHART HELPERS (native SVG/HTML) ========================= */
function barChart(vals, labels){
  const max=Math.max(...vals,1);
  return `<div class="barchart">${vals.map((v,i)=>`<div class="bar" style="height:${Math.round(v/max*100)}%" title="${labels[i]}: ${v}"><span class="bv">${v}</span><span class="bl">${labels[i]}</span></div>`).join('')}</div><div style="height:14px"></div>`;
}
function donutChart(data){ // [[label,val,color]]
  const total=data.reduce((s,d)=>s+d[1],0)||1; let acc=0; const R=54, C=2*Math.PI*R;
  const segs=data.map(d=>{ const frac=d[1]/total; const dash=frac*C; const seg=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${d[2]}" stroke-width="18" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`; acc+=dash; return seg; }).join('');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140">${segs}<text x="70" y="66" text-anchor="middle" font-size="24" font-weight="800" fill="currentColor">${total}</text><text x="70" y="84" text-anchor="middle" font-size="10" fill="var(--muted)">TOTAL</text></svg>
    <div class="legend" style="flex-direction:column;gap:8px">${data.map(d=>`<div class="li"><span class="sw" style="background:${d[2]}"></span><span style="font-weight:600">${d[0]}</span><span class="muted">${d[1]}</span></div>`).join('')}</div></div>`;
}
function lineChart(vals, labels, color){
  color=color||'var(--brand-500)'; const w=560,h=140,pad=8; const max=Math.max(...vals,1),min=Math.min(...vals,0);
  const pts=vals.map((v,i)=>[pad+i*((w-2*pad)/(vals.length-1)), h-pad-((v-min)/(max-min||1))*(h-2*pad)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L ${pts[pts.length-1][0]} ${h-pad} L ${pts[0][0]} ${h-pad} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto"><defs><linearGradient id="la" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#la)"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"/>`).join('')}</svg>
    <div class="legend" style="justify-content:space-between">${labels.map(l=>`<span class="small muted">${l}</span>`).join('')}</div>`;
}

function exportCSV(rows, filename){
  if(!rows.length) return;
  const keys=Object.keys(rows[0]);
  const csv=[keys.join(',')].concat(rows.map(r=>keys.map(k=>`"${String(r[k]).replace(/"/g,'""')}"`).join(','))).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
}

  $('#sub-fname',c).oninput=e=>$('#sub-fnhead',c).textContent=e.target.value||'file';
  $$('[data-sample]',c).forEach(b=>b.onclick=()=>{ ta.value=CODE_SAMPLES[b.dataset.sample]; sync(); toast('Sample loaded','Example code inserted into the editor.','info'); });
  const drop=$('#sub-drop',c), file=$('#sub-file',c);
  drop.onclick=()=>file.click();
  file.onchange=()=>{ const f=file.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ ta.value=r.result; $('#sub-fname',c).value=f.name; $('#sub-fnhead',c).textContent=f.name; sync(); toast('File loaded',f.name+' loaded into editor.','ok'); }; r.readAsText(f); };

  $('#sub-validate',c).onclick=()=>{ if(!ta.value.trim()){ toast('Empty submission','Please add some code before validating.','warn'); return; } toast('Validation passed','No obvious syntax issues detected in this demo check.','ok'); };
  $('#sub-draft',c).onclick=()=>toast('Draft saved','Your draft has been saved locally.','info');
  $('#sub-submit',c).onclick=()=>{

    const aid=$('#sub-assign',c).value; const a=DB.assignments.find(x=>x.id===aid);
    const sub={id:'SUB-'+pad(DB.submissions.length+1,4), assignment:aid, assignmentTitle:a.title, student:S.currentUser.name, studentId:S.currentUser.id, lang:$('#sub-lang',c).value, code:ta.value, codeKey:'custom', submitted:new Date().toISOString().slice(0,16).replace('T',' '), status:'Pending', size:ta.value.length, lines:ta.value.split('\n').length};
    DB.submissions.unshift(sub); a.submissions++; persist();
    logAudit('Submission Received','Submissions'); addNotification('Submission received',S.currentUser.name+' submitted to '+a.title+'.','info','submission');
    toast('Submitted','Your code was submitted to '+a.title+'.','ok');
    go('mysubmissions');
  };
  sync();
}

function pipelineStepHTML(p,i,step){
  const cls= step>i?'done': step===i?'active':'';
  const state= step>i?'Completed': step===i?'Processing':'Pending';
  const icon= step>i?IC.check: (i+1);
  return `<div class="pipeline-step ${cls}" data-step="${i}"><div class="ps-icon">${icon}</div><div class="ps-body"><div class="ps-title">${p[0]}</div><div class="ps-desc">${p[1]}</div></div><div class="ps-state ${step>i?'up':step===i?'':''}" style="color:${step>i?'var(--ok-600)':step===i?'var(--accent-600)':'var(--faint)'}">${state}</div></div>`;
}
function runPipeline(c){
  const A=S._analysis; if(A.running) return; A.running=true; A.step=-1; A.result=null;
  $('#an-run',c).disabled=true; $('#an-run',c).innerHTML=IC.clock+' Running…';
  toast('Analysis started','Demo analysis engine is processing the submissions.','info');
  const result=analyzePair(CODE_SAMPLES[A.a], CODE_SAMPLES[A.b], DB.config);
  let i=0;
  const tick=()=>{
    A.step=i;
    const pl=$('#an-pipeline',c); if(pl) pl.innerHTML=PIPELINE.map((p,k)=>pipelineStepHTML(p,k,A.step)).join('');
    i++;
    if(i<=PIPELINE.length){ setTimeout(tick, 340); }
    else {
      A.running=false; A.result=result; A.step=PIPELINE.length;
      const rb=$('#an-run',c); if(rb){ rb.disabled=false; rb.innerHTML=IC.play+' Run Again'; }
      const rr=$('#an-results',c); if(rr){ rr.innerHTML=resultsHTML(result); wireResults(c,result); }
      logAudit('Analysis Run','Analysis Engine');
      const sev=result.overall>=80?'High':result.overall>=60?'Medium':'Low';
      if(result.overall>=DB.config.simThreshold){ toast('Review threshold exceeded','Similarity '+result.overall+'% exceeds the configured '+DB.config.simThreshold+'% review threshold.','warn'); }
      else { toast('Analysis completed','Similarity '+result.overall+'% — below review threshold.','ok'); }
    }
  };
  tick();
}

/* ========================= CODE COMPARISON VIEWER ========================= */
function lcsMatchLines(a,b){ // mark structurally similar lines (normalized token compare)
  const norm=l=>l.trim().replace(/[A-Za-z_]\w*/g,t=>PY_KW.has(t.toLowerCase())?t.toLowerCase():'ID').replace(/\d+/g,'N').replace(/\s+/g,' ');
  const bn=b.map(norm);
  return a.map(la=>{ const na=norm(la); if(!na) return 0; const idx=bn.indexOf(na); return idx>=0?(la.trim()===b[idx].trim()?2:1):0; });
}
function openCompareViewer(codeA, codeB, r){
  const la=codeA.split('\n'), lb=codeB.split('\n');
  const ma=lcsMatchLines(la,lb), mb=lcsMatchLines(lb,la);
  const render=(lines,marks,label,file)=>`<div class="code-panel"><div class="cp-head">${IC.code} ${label} <span class="small muted" style="margin-left:auto">${file}</span></div><div class="code-body">${lines.map((l,i)=>`<div class="code-line ${marks[i]===2?'match-hi':marks[i]===1?'match':''}"><span class="ln">${i+1}</span><span class="lc">${esc(l)||' '}</span></div>`).join('')}</div></div>`;
  openModal({title:'Code comparison', icon:'code', wide:'xwide', body:`
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><span class="badge b-danger"><span class="dot"></span>Exact structural match</span><span class="badge b-warn"><span class="dot"></span>Normalized match</span>${r?`<span class="chip" style="margin-left:auto">Overall ${r.overall}%</span>`:''}</div>
    <div class="compare-grid">${render(la,ma,'Submission A','submission_a.py')}${render(lb,mb,'Submission B','submission_b.py')}</div>
    <div class="card pad" style="margin-top:14px"><div class="sec-title">${IC.layers} Detected similar structures</div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">${[['Function structure',IC.gitbranch],['Loop structure',IC.route],['Conditional structure',IC.compass],['Variable relationships',IC.layers],['Expression patterns',IC.code],['Call patterns',IC.activity]].map(s=>`<div style="display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:9px"><span style="color:var(--brand-500);width:18px">${s[1]}</span><span class="small" style="font-weight:600">${s[0]}</span></div>`).join('')}</div></div>`,
    foot:`<button class="btn primary" onclick="this.closest('.modal-overlay').remove()">Close</button>`});
}

/* ========================= AST VISUALIZATION ========================= */
function renderASTSvg(root, highlightSet, id){
  layoutAST(root);
  const {out,edges}=collectNodes(root,[],[]);
  const xs=out.map(n=>n.x), ys=out.map(n=>n.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs), maxY=Math.max(...ys);
  const W=maxX-minX+180, H=maxY+90;
  const colorFor=t=>({Module:'#2668b8',FunctionDef:'#12b0ac',ClassDef:'#8e44ad',For:'#e0a12b',While:'#e0a12b',If:'#e0503f',Else:'#e0503f',Return:'#1a7f4b',Assign:'#2668b8',BinOp:'#0a8f8f',Call:'#5a6a80',Import:'#8695a9',Name:'#8695a9',Compare:'#e0503f'}[t]||'#5a6a80');
  const nodeW=88,nodeH=30;
  const nx=n=>n.x-minX+50;
  const edgesSvg=edges.map(([p,c])=>`<path d="M${nx(p)+nodeW/2} ${p.y+nodeH+8} C ${nx(p)+nodeW/2} ${p.y+nodeH+30}, ${nx(c)+nodeW/2} ${c.y-10}, ${nx(c)+nodeW/2} ${c.y+8}" stroke="var(--line)" stroke-width="1.5" fill="none"/>`).join('');
  const nodesSvg=out.map(n=>{ const hl=highlightSet&&highlightSet.has(astCanon(n)); const hasKids=n.children.length>0;
    return `<g class="ast-node" data-nid="${n.id}" data-astid="${id}" style="cursor:${hasKids?'pointer':'default'}"><rect x="${nx(n)}" y="${n.y+8}" width="${nodeW}" height="${nodeH}" rx="7" fill="var(--surface)" stroke="${hl?'#e0503f':colorFor(n.type)}" stroke-width="${hl?2.5:1.6}"/>${hl?`<rect x="${nx(n)}" y="${n.y+8}" width="${nodeW}" height="${nodeH}" rx="7" fill="#e0503f" opacity="0.08"/>`:''}<text x="${nx(n)+nodeW/2}" y="${n.y+27}" text-anchor="middle" fill="${colorFor(n.type)}" font-weight="600">${esc(n.collapsed?n.type+' …':n.label)}</text></g>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:100%">${edgesSvg}${nodesSvg}</svg>`;
}
function openASTViewer(codeA, codeB){
  let astA=buildDemoAST(codeA), astB=buildDemoAST(codeB);
  let zoom=1, highlight=false;
  const canonSet=(root)=>{ const s=new Set(); collectNodes(root,[],[]).out.forEach(n=>{ if(n.children.length) s.add(astCanon(n)); }); return s; };
  const draw=(cont)=>{
    let hlA=null,hlB=null;
    if(highlight){ const sa=canonSet(astA), sb=canonSet(astB); const common=new Set([...sa].filter(x=>sb.has(x))); hlA=common; hlB=common; }
    $('#ast-a',cont).innerHTML=renderASTSvg(astA,hlA,'A');
    $('#ast-b',cont).innerHTML=renderASTSvg(astB,hlB,'B');
    $$('#ast-a svg, #ast-b svg',cont).forEach(s=>{ s.style.transform='scale('+zoom+')'; s.style.transformOrigin='top left'; });
    $$('.ast-node[style*="pointer"]',cont).forEach(g=>g.onclick=()=>{ const nid=g.dataset.nid, which=g.dataset.astid; const tree=which==='A'?astA:astB; const found=findNode(tree,nid); if(found){ found.collapsed=!found.collapsed; draw(cont); }});
  };
  function findNode(root,id){ if(root.id===id)return root; for(const ch of root.children){ const f=findNode(ch,id); if(f)return f; } return null; }
  const {el:m}=openModal({title:'Abstract Syntax Tree comparison', icon:'gitbranch', wide:'xwide', body:`
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
      <button class="btn subtle sm" id="ast-zoomin">Zoom +</button><button class="btn subtle sm" id="ast-zoomout">Zoom −</button><button class="btn subtle sm" id="ast-reset">Reset</button>
      <button class="btn accent sm" id="ast-compare">${IC.layers} Compare AST Structures</button>
      <span class="small muted" style="margin-left:auto">Click a node to collapse / expand its subtree.</span>
    </div>
    <div class="compare-grid">
      <div><div class="small muted" style="font-weight:700;margin-bottom:6px">Submission A</div><div class="ast-canvas" style="height:340px;overflow:auto;padding:10px" id="ast-a"></div></div>
      <div><div class="small muted" style="font-weight:700;margin-bottom:6px">Submission B</div><div class="ast-canvas" style="height:340px;overflow:auto;padding:10px" id="ast-b"></div></div>
    </div>
    <div class="notice integrity" style="margin-top:12px" id="ast-note"><span class="ni">${IC.info}</span><div>Each tree shows the structural shape of the code. Click <strong>Compare AST Structures</strong> to highlight structurally equivalent subtrees — this is resilient to variable renaming because identifiers are normalized before comparison.</div></div>`,
    foot:`<button class="btn primary" onclick="this.closest('.modal-overlay').remove()">Close</button>`});
  $('#ast-zoomin',m).onclick=()=>{ zoom=Math.min(2,zoom+0.15); draw(m); };
  $('#ast-zoomout',m).onclick=()=>{ zoom=Math.max(0.5,zoom-0.15); draw(m); };
  $('#ast-reset',m).onclick=()=>{ zoom=1; astA=buildDemoAST(codeA); astB=buildDemoAST(codeB); highlight=false; $('#ast-compare',m).classList.remove('accent'); draw(m); };
  $('#ast-compare',m).onclick=()=>{ highlight=!highlight; $('#ast-note',m).querySelector('div').innerHTML= highlight?'<strong>Structurally equivalent subtrees are highlighted</strong> in both trees. Renamed variables do not prevent the match because identifiers were normalized during AST normalization.':'Click <strong>Compare AST Structures</strong> to highlight structurally equivalent subtrees.'; draw(m); };
  draw(m);
}

  $('#pf-pw',c).onclick=()=>{ const {el:m,close}=openModal({title:'Change password',icon:'lock',body:`<div class="field"><label>Current password</label><input class="input" type="password" placeholder="••••••••"></div><div class="field"><label>New password</label><input class="input" type="password" id="pf-new" placeholder="At least 8 characters"></div><div class="field"><label>Confirm new password</label><input class="input" type="password" id="pf-new2"></div>`,foot:`<button class="btn ghost" data-c>Cancel</button><button class="btn primary" data-s>Update password</button>`}); $('[data-c]',m).onclick=close; $('[data-s]',m).onclick=()=>{ const n=$('#pf-new',m).value; if(n.length<8){toast('Too short','Password must be at least 8 characters.','warn');return;} if(n!==$('#pf-new2',m).value){toast('Mismatch','Passwords do not match.','danger');return;} u.pass=n; persist(); logAudit('Password Changed','User Management','Warning'); close(); toast('Password updated','Your password was changed (demo).','ok'); }; };
  $('#pf-mfa',c).onclick=()=>{ u.mfa=!u.mfa; persist(); toast('MFA',u.mfa?'MFA enabled.':'MFA disabled.','info'); profilePage(c); };
}

/* ========================= NOTIFICATIONS PAGE ========================= */
function notificationsPage(c){
  const rerender=()=>notificationsPage(c);
  S._nfilter=S._nfilter||'all';
  let rows=DB.notifications;
  if(S._nfilter==='unread') rows=rows.filter(n=>!n.read);
  else if(S._nfilter!=='all') rows=rows.filter(n=>n.cat===S._nfilter);
  c.innerHTML=pageHead('Notifications', `${DB.notifications.filter(n=>!n.read).length} unread.`,
    `<button class="btn subtle" id="nf-markall">Mark all read</button>`)+
  `<div class="toolbar">${[['all','All'],['unread','Unread'],['case','Cases'],['analysis','Analyses'],['security','Security'],['assignment','Assignments']].map(f=>`<button class="btn ${S._nfilter===f[0]?'primary':'ghost'} sm" data-nf="${f[0]}">${f[1]}</button>`).join('')}</div>
  <div class="card">${rows.length?rows.map(n=>{ const km={ok:'b-ok',warn:'b-warn',danger:'b-danger',info:'b-info'}[n.kind]||'b-info'; const ic={case:'shield',analysis:'cpu',submission:'upload',assignment:'file',security:'lock',system:'settings'}[n.cat]||'bell'; return `<div class="notif-item ${n.read?'':'unread'}" data-nid="${n.id}"><div class="ni-ic ${km}">${IC[ic]}</div><div style="flex:1"><div class="ni-t">${esc(n.title)}</div><div class="ni-m">${esc(n.msg)}</div><div class="ni-time">${esc(n.time)}</div></div><button class="icon-btn" style="padding:5px" data-ndel="${n.id}">${IC.trash}</button></div>`; }).join(''):`<div class="empty">${IC.bell}<div>No notifications in this view.</div></div>`}</div>`;
  $$('[data-nf]',c).forEach(b=>b.onclick=()=>{ S._nfilter=b.dataset.nf; rerender(); });
  $('#nf-markall',c).onclick=()=>{ DB.notifications.forEach(n=>n.read=true); persist(); toast('Notifications','All marked as read.','ok'); rerender(); renderApp(); };
  $$('[data-nid]',c).forEach(it=>it.onclick=e=>{ if(e.target.closest('[data-ndel]'))return; const n=DB.notifications.find(x=>x.id===it.dataset.nid); if(n){n.read=true;persist();rerender();renderApp();} });
  $$('[data-ndel]',c).forEach(b=>b.onclick=e=>{ e.stopPropagation(); DB.notifications=DB.notifications.filter(x=>x.id!==b.dataset.ndel); persist(); rerender(); renderApp(); });
}

/* ========================= STUDENT: FEEDBACK ========================= */
function feedbackPage(c){
  const mySubs=DB.submissions.filter(s=>s.student===S.currentUser.name);
  c.innerHTML=pageHead('Feedback', 'Lecturer feedback on your submissions.')+integrityNotice()+
  `${mySubs.length?mySubs.map(s=>`<div class="card pad" style="margin-bottom:12px"><div style="display:flex;gap:12px;align-items:center"><div class="ic" style="width:40px;height:40px;border-radius:11px;background:var(--surface-2);color:var(--brand-500);display:grid;place-items:center">${IC.msg}</div><div style="flex:1"><div style="font-weight:700">${esc(s.assignmentTitle)}</div><div class="small muted">${esc(s.id)} · Submitted ${esc(s.submitted)}</div></div>${statusBadge(s.status==='Analyzed'?'Analyzed':'Pending')}</div><div class="divider"></div><div class="small">${s.status==='Analyzed'?'Your submission has been analyzed. No integrity concerns were raised that require your attention. Keep writing your own original code.':'Your submission is awaiting review. Feedback will appear here once your lecturer has reviewed it.'}</div></div>`).join(''):`<div class="empty">${IC.msg}<div>No feedback yet. Submit an assignment to receive feedback.</div></div>`}`;
}

/* ========================= ACADEMIC INTEGRITY (student) ========================= */
function integrityPage(c){
  c.innerHTML=pageHead('Academic Integrity', 'Understand how similarity checking works and how to submit with confidence.')+
  `<div class="integrity-band" style="margin-bottom:20px"><div style="width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;margin:0 auto 14px;color:#3fd0c9">${IC.shield}</div><h3>Similarity is evidence, not a verdict</h3><p>CodeGuard AI identifies potential structural similarity between submissions. Results are reviewed by your lecturer and are never an automatic penalty.</p></div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    ${[['What is checked?',IC.gitbranch,'Your code\'s structure — functions, loops, conditionals and expressions — is compared to other submissions, even if variable names or formatting differ.'],['Why write your own code?',IC.code,'You learn far more by solving problems yourself, and structural similarity to a classmate\'s solution can trigger a review.'],['Working together',IC.users,'Discussing ideas is usually fine; copying code is not. When collaboration is allowed, still write your own implementation.'],['If you\'re flagged',IC.msg,'A flag means a lecturer will look at the evidence. Be ready to explain your approach; honest, original work has nothing to fear.'],['Citing references',IC.book,'If your lecturer permits external references, cite them clearly. Unattributed copied code is a problem even from the web.'],['Ask when unsure',IC.help,'Not sure what\'s allowed for an assignment? Ask your lecturer before you submit.']].map(x=>`<div class="card pad"><div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><div class="ic" style="width:38px;height:38px;border-radius:10px;background:var(--surface-2);color:var(--brand-500);display:grid;place-items:center">${x[1]}</div><h3 style="margin:0;font-size:15px">${x[0]}</h3></div><p class="small muted" style="margin:0">${x[2]}</p></div>`).join('')}
  </div>`;
}

/* ========================= HELP CENTER ========================= */
function helpPage(c){
  const sections=[
    ['How plagiarism detection works','The engine parses each submission into an Abstract Syntax Tree, normalizes identifiers and formatting, then compares structural signatures and token n-grams. A lightweight AI ranker prioritizes pairs for human review.'],
    ['What is an AST?','An Abstract Syntax Tree is a structural representation of code. It captures the shape of the program — functions, loops, conditionals and expressions — independent of variable names and formatting.'],
    ['What is structural similarity?','It measures how similar two programs are in structure rather than text. Two solutions can look different line-by-line yet share the same structure — which surface text comparison would miss.'],
    ['What is AI-assisted scoring?','A lightweight model combines structural and token features to rank pairs by risk. It assists prioritization; it never decides misconduct.'],
    ['How to interpret similarity scores','Higher scores mean stronger structural correspondence and a stronger case for review. They are evidence, not proof.'],
    ['Understanding false positives','Common assignments, small solution spaces and standard patterns can produce high similarity without any misconduct. Always review the evidence.'],
    ['Understanding false negatives','Deep semantic plagiarism (e.g. a complete rewrite that preserves logic) can evade structural comparison. Human judgement remains essential.'],
    ['Academic integrity','Similarity results support instructor review. Final academic decisions remain the responsibility of authorized academic staff.'],
    ['Lecturer review process','Detect → create case → notify lecturer → review evidence → compare code → record notes → decide → update status → audit.'],
    ['Student guidelines','Write your own code, cite permitted references, and ask your lecturer when unsure what collaboration is allowed.'],
  ];
  c.innerHTML=pageHead('Help Center', 'Understand how CodeGuard AI works and how to use it responsibly.')+
  `<div class="grid" style="grid-template-columns:1fr 1fr">${sections.map((s,i)=>`<div class="card pad"><div style="display:flex;gap:10px;align-items:center;margin-bottom:6px"><div class="ic" style="width:34px;height:34px;border-radius:9px;background:var(--surface-2);color:var(--brand-500);display:grid;place-items:center">${IC.help}</div><h3 style="margin:0;font-size:15px">${s[0]}</h3></div><p class="small muted" style="margin:0">${s[1]}</p></div>`).join('')}</div>
  <div class="notice integrity" style="margin-top:16px"><span class="ni">${IC.shield}</span><div><strong>Academic Integrity Notice.</strong> Similarity results are evidence for academic review and should not be interpreted as automatic proof of misconduct. Final academic decisions remain the responsibility of authorized academic staff.</div></div>`;
}

/* ========================= DEMO / PRESENTATION MODE ========================= */
const DEMO_STEPS=[
  ['dashboard','Dashboard','Start on the administrator overview — system status, users, submissions and potential cases at a glance.'],
  ['assignments','Assignment','Open Assignments. The scenario uses "Student Grade Calculator" in Introduction to Programming.'],
  ['submissions','Submission','Two students submitted structurally similar code. Review the submissions list.'],
  ['analysis','Analysis','Run the full 12-stage detection pipeline on the pair. Watch each stage transition Pending → Processing → Completed.'],
  ['analysis','AST','From the results, open the AST viewer and click "Compare AST Structures" to highlight equivalent subtrees despite renamed variables.'],
  ['analysis','Similarity','Review structural, token, normalized and AI-assisted scores, plus the classification.'],
  ['cases','Case','A case was created. Open it to see the review workflow, evidence and reviewer notes.'],
  ['reports','Report','Generate a printable similarity report with evidence and reviewer status.'],
];
function startDemoMode(){
  S.demoActive=true; S.demoStep=0; showDemoOverlay();
}
function showDemoOverlay(){
  const step=DEMO_STEPS[S.demoStep];
  go(step[0]);
  let ov=$('#demoOverlay'); if(ov) ov.remove();
  ov=el(`<div id="demoOverlay" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:130;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:16px 18px;max-width:520px;width:calc(100% - 40px)">
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px"><div class="ic" style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand-600),var(--accent-500));color:#fff;display:grid;place-items:center;font-weight:800">${S.demoStep+1}</div><div style="flex:1"><div style="font-weight:800;font-size:15px">${step[1]}</div><div class="small muted">Guided demonstration · Step ${S.demoStep+1} of ${DEMO_STEPS.length}</div></div><button class="icon-btn" id="demo-x">${IC.x}</button></div>
    <p class="small" style="margin:0 0 12px">${step[2]}</p>
    <div class="pbar" style="margin-bottom:12px"><span style="width:${(S.demoStep+1)/DEMO_STEPS.length*100}%"></span></div>
    <div style="display:flex;gap:8px"><button class="btn ghost sm" id="demo-prev" ${S.demoStep===0?'disabled':''}>Previous</button><div style="flex:1"></div>${S.demoStep<DEMO_STEPS.length-1?'<button class="btn primary sm" id="demo-next">Next step</button>':'<button class="btn accent sm" id="demo-done">Finish</button>'}</div>
  </div>`);
  $('#overlay-root').appendChild(ov);
  $('#demo-x',ov).onclick=()=>{ S.demoActive=false; ov.remove(); };
  const p=$('#demo-prev',ov); if(p) p.onclick=()=>{ S.demoStep--; showDemoOverlay(); };
  const n=$('#demo-next',ov); if(n) n.onclick=()=>{ S.demoStep++; showDemoOverlay(); };
  const d=$('#demo-done',ov); if(d) d.onclick=()=>{ S.demoActive=false; ov.remove(); toast('Demo complete','You have walked through the full detection scenario.','ok'); };
}

/* ========================= MASTER RENDER + INIT ========================= */
function render(){
  const app=$('#app');
  // clear transient overlays that shouldn't persist across full renders
  if(S.view!=='app'){ const d=$('#demoOverlay'); if(d){d.remove(); S.demoActive=false;} }
  if(S.view==='landing') renderLanding();
  else if(S.view==='auth') renderAuth();
  else if(S.view==='app'){
    if(!S.currentUser){ S.view='landing'; renderLanding(); return; }
    renderApp();
  } else renderLanding();
}

function init(){
  try{ loadState(); }
  catch(e){ console.error('Init error, reseeding:', e); DB=freshDB(); S={view:'landing',page:'dashboard',currentUser:null,theme:'light'}; }
  render();
  // expose a couple of handlers used by inline onclick
  window.go=go;
}
document.addEventListener('DOMContentLoaded', init);
// If DOM already parsed (script at end of body), run now:
if(document.readyState!=='loading') init();

</script>
</body>
</html>
